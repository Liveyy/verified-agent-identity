name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Agent Name'
        required: true
        default: 'leev'
      agent_description:
        description: 'Agent Description'
        required: true
        default: 'leev AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Step 1 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 2 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js \
          --challenge "{\"name\": \"leev\", \"description\": \"leev AI Agent\"}"
